<title>Chem 32 Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Lab-notebook study app: fixed lecture index on the left, one section (notes, slides, quiz) at a time on the right */
:root {
  --bg: #eef2f1; --panel: #ffffff; --panel-2: #e6ecea; --ink: #16201d; --muted: #5d6b67; --line: #d5dedb;
  --accent: #0f6e5c; --accent-ink: #ffffff; --accent-soft: #d6ece6;
  --good: #1f7a3a; --good-soft: #e1f3e6; --bad: #b3261e; --bad-soft: #fbe5e3; --warn: #9a6400;
  --shadow: 0 1px 2px rgba(10,30,25,.05), 0 4px 16px rgba(10,30,25,.05);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --panel: #1a211f; --panel-2: #222b28; --ink: #e8eeec; --muted: #9aa8a4; --line: #2e3936;
    --accent: #52c2a6; --accent-ink: #0d1a16; --accent-soft: #1d3a33;
    --good: #6fcf8a; --good-soft: #1c3324; --bad: #f28b82; --bad-soft: #3d2120; --warn: #e3b25a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --panel: #1a211f; --panel-2: #222b28; --ink: #e8eeec; --muted: #9aa8a4; --line: #2e3936;
  --accent: #52c2a6; --accent-ink: #0d1a16; --accent-soft: #1d3a33;
  --good: #6fcf8a; --good-soft: #1c3324; --bad: #f28b82; --bad-soft: #3d2120; --warn: #e3b25a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--panel); }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 18px; }
.top .grow { flex: 1; }
.pill { font-size: 13px; color: var(--muted); background: var(--panel-2); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; }
#menuBtn { display: none; }

.wrap { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 53px); }
nav { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 10px 40px; position: sticky; top: 53px; height: calc(100vh - 53px); overflow-y: auto; }
nav .nav-top { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-weight: 600; }
nav .nav-top:hover, nav .sec:hover { background: var(--panel-2); }
nav .lec { margin-top: 14px; }
nav .lec-h { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; font-weight: 600; }
nav .sec { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-size: 14px; }
nav .sec .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 34px; font-size: 12px; }
nav .sec .t { flex: 1; }
nav .active { background: var(--accent-soft) !important; color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.dot.part { background: var(--warn); } .dot.done { background: var(--good); }

main { padding: 28px 32px 80px; max-width: 920px; width: 100%; min-width: 0; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.page-h { font-size: 30px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 18px; }
.card h3 { font-size: 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.card h3 .grow { flex: 1; }
.notes { margin: 0; padding-left: 20px; }
.notes li { margin: 6px 0; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
.strip button { flex: none; border: 1px solid var(--line); border-radius: 8px; padding: 0; background: #fff; overflow: hidden; scroll-snap-align: start; }
.strip img { display: block; width: 200px; height: 112px; object-fit: cover; }
.strip .cap { font-size: 11px; color: #555; padding: 2px 6px; text-align: left; background: #fff; }

.qtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .5; cursor: default; }
.score { font-size: 14px; color: var(--muted); }
.bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

.q { border-top: 1px solid var(--line); padding: 16px 0 6px; }
.q:first-of-type { border-top: 0; }
.q .qn { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.q .qt { font-weight: 500; margin: 2px 0 10px; }
.q .fig { display: block; border: 1px solid var(--line); border-radius: 8px; padding: 0; background: #fff; margin: 4px 0 12px; max-width: 100%; overflow: hidden; }
.q .fig img { display: block; max-width: 100%; max-height: 300px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 12px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--panel-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: var(--panel); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--panel); }
.explain { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); font-size: 14px; }
.explain b.ok { color: var(--good); } .explain b.no { color: var(--bad); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; font-size: inherit; }

.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
.pager .btn { max-width: 48%; text-align: left; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.lec-card { cursor: pointer; text-align: left; margin: 0; }
.lec-card:hover { border-color: var(--accent); }
.lec-card .lab { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.lec-card h3 { margin: 4px 0 6px; }
.lec-card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.stat { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

.exam-set label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.exam-set select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.big { font-family: var(--display); font-size: 44px; font-weight: 700; }
.muted { color: var(--muted); }

.lb { position: fixed; inset: 0; z-index: 50; background: rgba(10,10,10,.88); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.lb.open { display: flex; }
.lb img { max-width: 100%; max-height: calc(100vh - 100px); border-radius: 6px; background: #fff; }
.lb .lb-bar { display: flex; gap: 10px; align-items: center; margin-top: 12px; color: #eee; font-size: 14px; }
.lb .lb-bar button { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 8px; padding: 6px 12px; }

@media (max-width: 820px) {
  #menuBtn { display: inline-block; }
  .wrap { grid-template-columns: 1fr; }
  nav { position: fixed; top: 53px; left: 0; bottom: 0; width: 290px; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  nav.open { transform: none; }
  main { padding: 20px 16px 80px; }
  .page-h { font-size: 24px; }
  .top .pill.hide-sm { display: none; }
}
</style>
<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="Open menu">☰</button>
  <h1>Chem 32 Reviewer</h1>
  <span class="grow"></span>
  <span class="pill hide-sm" id="overall"></span>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Slide viewer">
  <img id="lbImg" alt="">
  <div class="lb-bar">
    <button id="lbPrev" aria-label="Previous slide">‹ Prev</button>
    <span id="lbCap"></span>
    <button id="lbNext" aria-label="Next slide">Next ›</button>
    <button id="lbClose" aria-label="Close">✕</button>
  </div>
</div>
<script src="data.js"></script>
<script>
const C = window.COURSE;
const LEC_NAMES = { L1: "Lecture 1", L2: "Lecture 2", L3: "Lecture 3", L4: "Lecture 4", CW: "Classwork 1" };

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// ~CH3CH2OH~ → subscript digits after letters/brackets; "^" starts a superscript
const fmt = s => String(s).replace(/~([^~]+)~/g, (_, f) => {
  const [base, sup] = f.split("^");
  return base.replace(/([A-Za-z\)\]])(\d+)/g, "$1<sub>$2</sub>") + (sup ? `<sup>${sup.replace("-", "−")}</sup>` : "");
});
const figSrc = id => `figs/${id}.jpg`;
const figLabel = id => id.startsWith("CW-") ? `Classwork 1 · ${id.slice(3)}` : `${LEC_NAMES[id.slice(0, 2)]} · slide ${+id.slice(3)}`;
const pad = n => String(n).padStart(2, "0");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const store = {
  get(k, d) { try { const v = localStorage.getItem("chem32:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("chem32:" + k, JSON.stringify(v)); } catch {} }
};
let answers = store.get("answers", {}); // qid -> { pick, ok }
const saveAnswers = () => store.set("answers", answers);

// flatten
const SECTIONS = [];
C.forEach(lec => lec.sections.forEach(sec => {
  sec.lec = lec;
  sec.key = lec.id + "/" + sec.id;
  sec.quiz.forEach((q, i) => { q.id = sec.key + "#" + i; q.sec = sec; });
  const [L, a, b] = sec.slides;
  sec.figs = [];
  for (let i = a; i <= b; i++) sec.figs.push(`${L}-${pad(i)}`);
  (sec.more || []).forEach(([L2, a2, b2]) => { for (let i = a2; i <= b2; i++) sec.figs.push(`${L2}-${pad(i)}`); });
  (sec.extra || []).forEach(e => sec.figs.push(e));
  SECTIONS.push(sec);
}));
const ALLQ = SECTIONS.flatMap(s => s.quiz);

function stats(qs) {
  let done = 0, ok = 0;
  qs.forEach(q => { const a = answers[q.id]; if (a) { done++; if (a.ok) ok++; } });
  return { total: qs.length, done, ok };
}

// ---------- theme ----------
(function () {
  const t = store.get("theme", null);
  if (t) document.documentElement.dataset.theme = t;
  $("#themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    store.set("theme", document.documentElement.dataset.theme);
  };
})();

// ---------- lightbox ----------
let lbList = [], lbIdx = 0;
function openLB(list, idx) { lbList = list; lbIdx = idx; showLB(); $("#lb").classList.add("open"); $("#lbClose").focus(); }
function showLB() {
  const id = lbList[lbIdx];
  $("#lbImg").src = figSrc(id); $("#lbImg").alt = figLabel(id);
  $("#lbCap").textContent = `${figLabel(id)}  (${lbIdx + 1}/${lbList.length})`;
  $("#lbPrev").disabled = lbIdx === 0; $("#lbNext").disabled = lbIdx === lbList.length - 1;
}
function closeLB() { $("#lb").classList.remove("open"); }
$("#lbPrev").onclick = () => { if (lbIdx > 0) { lbIdx--; showLB(); } };
$("#lbNext").onclick = () => { if (lbIdx < lbList.length - 1) { lbIdx++; showLB(); } };
$("#lbClose").onclick = closeLB;
$("#lb").onclick = e => { if (e.target.id === "lb") closeLB(); };
document.addEventListener("keydown", e => {
  if ($("#lb").classList.contains("open")) {
    if (e.key === "Escape") closeLB();
    if (e.key === "ArrowLeft") $("#lbPrev").click();
    if (e.key === "ArrowRight") $("#lbNext").click();
    return;
  }
  if (route.view === "exam" && exam && exam.phase === "run") {
    const n = parseInt(e.key, 10);
    const opts = document.querySelectorAll("#examQ .opt:not(:disabled)");
    if (n >= 1 && n <= opts.length) opts[n - 1].click();
    if (e.key === "Enter" && $("#examNext") && !$("#examNext").disabled) $("#examNext").click();
  }
});

// ---------- nav ----------
function renderNav() {
  const cur = route.view === "sec" ? route.key : route.view;
  let h = `<button class="nav-top ${cur === "home" ? "active" : ""}" data-go="#home">Overview</button>
           <button class="nav-top ${cur === "exam" ? "active" : ""}" data-go="#exam">Mixed exam</button>`;
  C.forEach(lec => {
    h += `<div class="lec"><div class="lec-h">${LEC_NAMES[lec.id]} · ${esc(lec.title)}</div>`;
    lec.sections.forEach(sec => {
      const s = stats(sec.quiz);
      const cls = s.done === 0 ? "" : s.done === s.total ? "done" : "part";
      h += `<button class="sec ${cur === sec.key ? "active" : ""}" data-go="#s/${sec.key}">
              <span class="num">${esc(sec.id)}</span><span class="t">${esc(sec.title)}</span><span class="dot ${cls}" title="${s.done}/${s.total} answered"></span></button>`;
    });
    h += `</div>`;
  });
  $("#nav").innerHTML = h;
  const all = stats(ALLQ);
  $("#overall").textContent = `${all.ok}/${all.total} correct · ${all.done} answered`;
}
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  go(b.dataset.go); $("#nav").classList.remove("open");
});
$("#menuBtn").onclick = () => $("#nav").classList.toggle("open");

// ---------- question rendering (shared by sections and exam) ----------
function choiceOrder(q) {
  const tf = q.c.length === 2 && /^(true|false)$/i.test(q.c[0]);
  return tf ? ["True", "False"].filter(x => q.c.includes(x)) : shuffle(q.c);
}
function qHTML(q, num, order) {
  const a = answers[q.id];
  const fig = q.fig ? `<button class="fig" data-fig="${q.fig}" aria-label="Enlarge figure"><img src="${figSrc(q.fig)}" alt="${esc(figLabel(q.fig))}" loading="lazy"></button>` : "";
  const opts = order.map((c, i) => {
    let cls = "";
    if (a) { if (c === q.c[0]) cls = "right"; else if (c === a.pick) cls = "wrong"; }
    return `<button class="opt ${cls}" ${a ? "disabled" : ""} data-q="${q.id}" data-c="${esc(c)}"><span class="k">${"ABCDEF"[i]}</span><span>${fmt(esc(c))}</span></button>`;
  }).join("");
  const ex = a ? explainHTML(q, a) : "";
  return `<div class="q" id="q-${cssId(q.id)}"><div class="qn">QUESTION ${num}</div><div class="qt">${fmt(esc(q.q))}</div>${fig}<div class="opts">${opts}</div><div class="exw">${ex}</div></div>`;
}
function explainHTML(q, a) {
  const see = q.fig ? ` <button class="linkbtn" data-fig="${q.fig}">View ${esc(figLabel(q.fig))}</button>` : "";
  return `<div class="explain">${a.ok ? '<b class="ok">Correct.</b>' : `<b class="no">Not quite.</b> Answer: <b>${fmt(esc(q.c[0]))}</b>.`} ${fmt(esc(q.x))}${see}</div>`;
}
const cssId = id => id.replace(/[^a-zA-Z0-9]/g, "_");
const QBYID = Object.fromEntries(ALLQ.map(q => [q.id, q]));

function answer(btn, after) {
  const q = QBYID[btn.dataset.q], pick = btn.dataset.c, ok = pick === q.c[0];
  answers[q.id] = { pick, ok }; saveAnswers();
  const box = btn.closest(".q");
  box.querySelectorAll(".opt").forEach(o => {
    o.disabled = true;
    if (o.dataset.c === q.c[0]) o.classList.add("right");
    else if (o === btn) o.classList.add("wrong");
  });
  box.querySelector(".exw").innerHTML = explainHTML(q, answers[q.id]);
  renderNav();
  after && after(q, ok);
}

// ---------- views ----------
// in-page routing: current view lives in this variable
let route = {}, target = location.hash || "#home";
function go(t) { target = t; render(); }
function parseRoute() {
  const h = target.replace(/^#/, "");
  if (h.startsWith("s/")) { const key = h.slice(2); if (SECTIONS.find(s => s.key === key)) return { view: "sec", key }; }
  if (h === "exam") return { view: "exam" };
  return { view: "home" };
}
function render() {
  route = parseRoute();
  renderNav();
  if (route.view === "sec") renderSection(SECTIONS.find(s => s.key === route.key));
  else if (route.view === "exam") renderExam();
  else renderHome();
  window.scrollTo(0, 0);
}

function renderHome() {
  const all = stats(ALLQ);
  const next = SECTIONS.find(s => stats(s.quiz).done < s.quiz.length) || SECTIONS[0];
  let h = `<div class="crumb">Chem 32 · Organic Chemistry</div><h2 class="page-h">Study reviewer</h2>
    <div class="card"><div class="stat"><span>Overall progress</span><span>${all.done}/${all.total} answered · ${all.done ? Math.round(100 * all.ok / all.done) : 0}% correct</span></div>
    <div class="bar"><i style="width:${100 * all.done / all.total}%"></i></div>
    <p class="muted" style="margin:12px 0 14px">Each section has key points, the lecture slides (tap to enlarge), and a quiz with instant feedback. Progress is saved in this browser.</p>
    <div class="qtools"><button class="btn primary" data-go="#s/${next.key}">${all.done ? "Continue" : "Start"}: ${esc(next.id)} ${esc(next.title)}</button>
    <button class="btn" data-go="#exam">Take a mixed exam</button></div></div>
    <div class="grid">`;
  C.forEach(lec => {
    const s = stats(lec.sections.flatMap(x => x.quiz));
    h += `<div class="card lec-card" data-go="#s/${lec.sections[0].key}" tabindex="0" role="button">
      <div class="lab">${LEC_NAMES[lec.id]}</div><h3>${esc(lec.title)}</h3><p>${esc(lec.sub)}</p>
      <div class="stat"><span>${lec.sections.length} sections · ${s.total} questions</span><span>${s.done ? Math.round(100 * s.ok / s.done) + "%" : "–"}</span></div>
      <div class="bar"><i style="width:${100 * s.done / s.total}%"></i></div></div>`;
  });
  h += `</div><p class="muted" style="font-size:13px;margin-top:20px"><button class="linkbtn" id="resetAll">Reset all progress</button></p>`;
  $("#main").innerHTML = h;
  // two-step reset instead of confirm()
  $("#resetAll").onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.armed) { answers = {}; saveAnswers(); render(); return; }
    b.dataset.armed = "1"; b.textContent = "Click again to erase all saved answers";
  };
}
$("#main").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const f = e.target.closest("[data-fig]");
  if (f) {
    const id = f.dataset.fig;
    const sec = route.view === "sec" ? SECTIONS.find(s => s.key === route.key) : null;
    const list = sec && sec.figs.includes(id) ? sec.figs : [id];
    openLB(list, list.indexOf(id));
  }
});
$("#main").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".lec-card")) e.target.click(); });

function renderSection(sec) {
  const i = SECTIONS.indexOf(sec), prev = SECTIONS[i - 1], next = SECTIONS[i + 1];
  const thumbs = sec.figs.map(id => `<button data-fig="${id}" aria-label="Open ${esc(figLabel(id))}"><img src="${figSrc(id)}" alt="" loading="lazy"><div class="cap">${esc(figLabel(id))}</div></button>`).join("");
  $("#main").innerHTML = `
    <div class="crumb">${LEC_NAMES[sec.lec.id]} · ${esc(sec.lec.title)}</div>
    <h2 class="page-h">${esc(sec.id)} ${esc(sec.title)}</h2>
    <div class="card"><h3>Key points</h3><ul class="notes">${sec.notes.map(n => `<li>${fmt(n)}</li>`).join("")}</ul></div>
    <div class="card"><h3>Slides <span class="grow"></span><span class="score">${sec.figs.length} figures</span></h3><div class="strip">${thumbs}</div></div>
    <div class="card" id="quizCard"><h3>Quiz <span class="grow"></span><span class="score" id="secScore"></span></h3>
      <div class="bar" style="margin-bottom:10px"><i id="secBar"></i></div>
      <div class="qtools" style="margin-bottom:6px">
        <button class="btn" id="retryMissed">Retry missed</button>
        <button class="btn" id="resetSec">Reset section</button>
      </div>
      <div id="qs"></div>
    </div>
    <div class="pager">
      ${prev ? `<button class="btn" data-go="#s/${prev.key}">‹ ${esc(prev.id)} ${esc(prev.title)}</button>` : "<span></span>"}
      ${next ? `<button class="btn" data-go="#s/${next.key}">${esc(next.id)} ${esc(next.title)} ›</button>` : `<button class="btn primary" data-go="#exam">Mixed exam ›</button>`}
    </div>`;
  const drawQs = () => {
    $("#qs").innerHTML = sec.quiz.map((q, k) => qHTML(q, k + 1, choiceOrder(q))).join("");
    updScore();
  };
  const updScore = () => {
    const s = stats(sec.quiz);
    $("#secScore").textContent = `${s.ok} correct · ${s.done}/${s.total} answered`;
    $("#secBar").style.width = (100 * s.done / s.total) + "%";
    $("#retryMissed").disabled = !sec.quiz.some(q => answers[q.id] && !answers[q.id].ok);
  };
  $("#qs").addEventListener("click", e => { const o = e.target.closest(".opt"); if (o && !o.disabled) answer(o, updScore); });
  $("#retryMissed").onclick = () => { sec.quiz.forEach(q => { if (answers[q.id] && !answers[q.id].ok) delete answers[q.id]; }); saveAnswers(); renderNav(); drawQs(); };
  $("#resetSec").onclick = () => { sec.quiz.forEach(q => delete answers[q.id]); saveAnswers(); renderNav(); drawQs(); };
  drawQs();
}

// ---------- mixed exam ----------
let exam = null;
function renderExam() {
  if (exam && exam.phase !== "setup") return exam.phase === "run" ? drawExamQ() : drawExamResult();
  const prefs = store.get("examPrefs", { lecs: C.map(l => l.id), n: "25", mode: "all" });
  $("#main").innerHTML = `
    <div class="crumb">All lectures</div><h2 class="page-h">Mixed exam</h2>
    <div class="card exam-set">
      <h3>Set up</h3>
      <div class="muted" style="margin-bottom:6px">Lectures to include</div>
      ${C.map(l => `<label><input type="checkbox" value="${l.id}" ${prefs.lecs.includes(l.id) ? "checked" : ""}> ${LEC_NAMES[l.id]}: ${esc(l.title)}</label>`).join("")}
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 16px">
        <label>Questions <select id="exN">${["10", "25", "50", "all"].map(v => `<option ${prefs.n === v ? "selected" : ""} value="${v}">${v === "all" ? "All" : v}</option>`).join("")}</select></label>
        <label>Pool <select id="exMode">
          <option value="all" ${prefs.mode === "all" ? "selected" : ""}>All questions</option>
          <option value="missed" ${prefs.mode === "missed" ? "selected" : ""}>Only ones I missed</option>
          <option value="new" ${prefs.mode === "new" ? "selected" : ""}>Only unanswered</option></select></label>
      </div>
      <button class="btn primary" id="exStart">Start exam</button> <span class="muted" id="exMsg" style="margin-left:8px"></span>
      <p class="muted" style="font-size:13px;margin:14px 0 0">Keyboard: press 1–4 to answer, Enter for the next question.</p>
    </div>`;
  $("#exStart").onclick = () => {
    const lecs = [...document.querySelectorAll(".exam-set input:checked")].map(x => x.value);
    const n = $("#exN").value, mode = $("#exMode").value;
    store.set("examPrefs", { lecs, n, mode });
    let pool = ALLQ.filter(q => lecs.includes(q.sec.lec.id));
    if (mode === "missed") pool = pool.filter(q => answers[q.id] && !answers[q.id].ok);
    if (mode === "new") pool = pool.filter(q => !answers[q.id]);
    if (!pool.length) { $("#exMsg").textContent = "No questions match. Pick other lectures or another pool."; return; }
    pool = shuffle(pool);
    if (n !== "all") pool = pool.slice(0, +n);
    pool.forEach(q => delete answers[q.id]); // fresh attempt for these
    saveAnswers(); renderNav();
    exam = { phase: "run", qs: pool, i: 0, results: [] };
    drawExamQ();
  };
}
function drawExamQ() {
  const q = exam.qs[exam.i];
  const ok = exam.results.filter(r => r).length;
  $("#main").innerHTML = `
    <div class="crumb">Mixed exam · ${LEC_NAMES[q.sec.lec.id]} · ${esc(q.sec.id)} ${esc(q.sec.title)}</div>
    <h2 class="page-h">Question ${exam.i + 1} of ${exam.qs.length}</h2>
    <div class="card"><div class="stat"><span>${ok} correct so far</span><span><button class="linkbtn" id="exQuit">End exam</button></span></div>
      <div class="bar" style="margin-bottom:6px"><i style="width:${100 * exam.i / exam.qs.length}%"></i></div>
      <div id="examQ">${qHTML(q, exam.i + 1, choiceOrder(q))}</div>
      <div class="qtools" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" id="examNext" disabled>${exam.i + 1 === exam.qs.length ? "See results" : "Next question"} ›</button></div>
    </div>`;
  $("#examQ").addEventListener("click", e => {
    const o = e.target.closest(".opt");
    if (o && !o.disabled) answer(o, (_, good) => { exam.results[exam.i] = good; $("#examNext").disabled = false; $("#examNext").focus(); });
  });
  $("#examNext").onclick = () => { exam.i++; if (exam.i >= exam.qs.length) { exam.phase = "done"; drawExamResult(); } else drawExamQ(); window.scrollTo(0, 0); };
  $("#exQuit").onclick = () => { exam.qs = exam.qs.slice(0, exam.results.length); exam.phase = "done"; drawExamResult(); };
}
function drawExamResult() {
  const n = exam.qs.length, ok = exam.results.filter(r => r).length;
  const missed = exam.qs.filter((q, i) => !exam.results[i]);
  const pct = n ? Math.round(100 * ok / n) : 0;
  // weakest sections
  const bySec = {};
  exam.qs.forEach((q, i) => { const k = q.sec.key; bySec[k] = bySec[k] || { sec: q.sec, ok: 0, n: 0 }; bySec[k].n++; if (exam.results[i]) bySec[k].ok++; });
  const weak = Object.values(bySec).filter(s => s.ok < s.n).sort((a, b) => a.ok / a.n - b.ok / b.n).slice(0, 5);
  $("#main").innerHTML = `
    <div class="crumb">Mixed exam</div><h2 class="page-h">Results</h2>
    <div class="card"><div class="big">${pct}%</div><div class="muted">${ok} of ${n} correct</div>
      <div class="qtools" style="margin-top:14px"><button class="btn primary" id="exAgain">New exam</button>
      ${missed.length ? `<button class="btn" id="exRetry">Retry the ${missed.length} missed</button>` : ""}</div></div>
    ${weak.length ? `<div class="card"><h3>Review these sections</h3>${weak.map(w => `<div class="stat"><button class="linkbtn" data-go="#s/${w.sec.key}">${esc(w.sec.id)} ${esc(w.sec.title)}</button><span>${w.ok}/${w.n}</span></div>`).join("")}</div>` : ""}
    ${missed.length ? `<div class="card"><h3>Missed questions</h3>${missed.map((q, i) => `<div class="q"><div class="qn">${esc(q.sec.id)} ${esc(q.sec.title)}</div><div class="qt">${fmt(esc(q.q))}</div>${q.fig ? `<button class="fig" data-fig="${q.fig}"><img src="${figSrc(q.fig)}" alt="${esc(figLabel(q.fig))}" loading="lazy"></button>` : ""}${explainHTML(q, answers[q.id] || { ok: false })}</div>`).join("")}</div>` : ""}`;
  $("#exAgain").onclick = () => { exam = null; renderExam(); };
  if (missed.length) $("#exRetry").onclick = () => {
    missed.forEach(q => delete answers[q.id]); saveAnswers(); renderNav();
    exam = { phase: "run", qs: shuffle(missed), i: 0, results: [] }; drawExamQ();
  };
}

render();
</script>
